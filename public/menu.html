<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="./css/menu.css">
    <script src="./js/sessao.js"></script>
</head>

<!-- Funções que são chamadas pós o carregamento da página -->

<body onload="listarCards(), validarSessao()">

    <header id="conteiner_cabecalho">

        <div id="imagem_cabecalho">
            <img src="./assets/imagens/Logo.svg" alt="">
        </div>
        <div id="Conteiner_informações">
            <h6><a href="./menu.html">Menu</a></h6>
            <h6><a href="./telahome.html">Quiz</a></h6>
            <h6><a href="../dashboard/dashboard.html">Dashboard</a></h6>
        </div>
        <div>
            <button id="botao_sair"><a href="./index.html">Sair</a></button>
        </div>
    </header>

    <section id="conteiner_menu">

        <div id="conteinerPrincipal">

            <div>
                <img src="./assets/imagens/icone_nota.avif" alt="">
            </div>

            <div id="titulo_menu">
                <h2>Diário de Memórias Musicais</h2>
                <p>Músicas que marcaram sua jornada emocional</p>
            </div>



            <div>
                <button onclick="criar()" id="botao_memoria">+ Nova memória</button>
            </div>
            <div id="conteiner_cards">


            </div>

    </section>



    </div>

    <div id="criar_card">
        <div id="novo_card">
            <img src="../assets/imagens/card_nota.avif" alt="">
            <h4>Nova Memória Musical</h4>
            <div id="sair_criar">
                <a href="./menu.html"><img src="./assets/imagens/icone-x.png" alt=""></a>
            </div>
        </div>
        <div id="informacoes_card">

            <p>Nome da Música</p>

            <input id="nomeMusica" type="text" placeholder=" Ex: The Hills">

            <p>Artista</p>

            <input id="cantor" type="text" placeholder=" Ex: The Wekend">

            <p>Memória</p>

            <input id="descricao" type="text" placeholder=" Descreva a memória especial">

            <p>Emoção</p>
            <select name="" id="sel_emocao">
                <option value="Selecione">Selecione</option>
                <option value="Paz">Paz</option>
                <option value="Amor">Amor</option>
                <option value="Alegria">Alegria</option>
                <option value="Energia">Energia</option>
                <option value="Esperança">Esperança</option>
                <option value="Nostalgia">Nostalgia</option>
            </select>

            <p>Ano</p>
            <input id="anoCard" type="Number" placeholder=" Ex: 2026">

        </div>

        <div id="botoes_card">

            <button onclick="cancelar()" id="botao_cancelar">Cancelar</button>
            <button id="botao_salvar" onclick="publicar()">Salvar</button>

        </div>

    </div>



</body>

</html>
<script>

    let listaCards = "";

    // função para  o conteúdo de criação dos cards fique ativo
    function criar() {

        criar_card.style.display = "block"


    }
    // função para quando o botao cancelar for clicado o conteúdo de criação suma
    function cancelar() {

        criar_card.style.display = "none"


    }

    // função para limpar campos após a inserção dos conteúdos dos cards
    function limparFormulario() {
        nomeMusica.value = "";
        cantor.value = "";
        descricao.value = "";
        sel_emocao.value = "Selecione";
        anoCard.value = "";
    }

    // função para  publicação do card
    function publicar() {

        // Pegamos o id do usuário no storage
        var idUsuario = sessionStorage.ID_USUARIO;

        var corpo = {
            nomeMusica: nomeMusica.value,
            cantor: cantor.value,
            descricao: descricao.value,
            tipoSentimento: sel_emocao.value,
            anoCard: anoCard.value
        }

        // fazemos a requisição de onde queremos publicar através do endpoint criado e inserimos conforme o id do usário
        fetch(`/avisos/publicar/${idUsuario}`, {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({

                nomeMusica: corpo.nomeMusica,
                cantor: corpo.cantor,
                descricao: corpo.descricao,
                tipoSentimento: corpo.tipoSentimento,
                anoCard: corpo.anoCard

            })
        }).then(function (resposta) {

            console.log("resposta: ", resposta);
            // Aós validar se a resposta está vindo de froma correta, realizamos o post do card, 
            // limpamos os campos e chamamos a função responsável pela listagem dos cards pra visualizar os cards cadatrados
            if (resposta.ok) {
                window.alert("Post realizado com sucesso pelo usuario de ID: " + idUsuario + "!");
                limparFormulario();
                listarCards()
                // finalizarAguardar();
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            // finalizarAguardar();
        });

        return false;

    }


    // função responsável pela visualização dos cards
    function listarCards() {

        var idUsuario = sessionStorage.ID_USUARIO;
        listaCards = "";


        // Requisição no endpoint feito para listagem, dessa forma conseguimos fazer a requisição de todos
        fetch(`/avisos/listar/${idUsuario}`, {
            method: "get",
            headers: {
                "Content-Type": "application/json"
            }

        }).then(function (resposta) {

            console.log("resposta: ", resposta);

            if (resposta.ok) {

                if (resposta.status == 204) {
                    conteiner_cards.innerHTML = ``;
                    return

                }
                resposta.json().then(function (respostaConvertida) {


                    // criação do laço de repetição para cada card ser construído através de json
                    for (let i = 0; i < respostaConvertida.length; i++) {

                        listaCards +=
                            `<div id="conteiner_card">
                            
                                <div id="conteiner_informacoes_card">
                                
                                    <div id="conteiner_titulosCard">
                                        <h4>${respostaConvertida[i].MÚSICA}</h4>
                                        <h5>${respostaConvertida[i].ARTISTA}</h5>
                                    </div>
                                    <div id="conteiner_excluirCard">
                                        <button id="botao_excluirCard" onclick="deletar(${respostaConvertida[i].id})">excluir</button>
                                    </div>
                                </div>
                                
                                <div id="descricao_card">
                                    ${respostaConvertida[i].DESCRIÇÃO}
                                    </div>
                                    
                                    <div id="conteiner_ano">
                                        
                                        <div id="conteiner_sentimento">
                                            ${respostaConvertida[i].SENTIMENTO}
                                            </div>
                                            <div id="ano">
                                                ${respostaConvertida[i].ANO}
                                                </div>
                                                </div>
                                                </div>`

                    }


                    // conteiner onde os cards estão sendo guardados após serem salvos
                    conteiner_cards.innerHTML = listaCards
                    console.log(listaCards);



                })

            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            // finalizarAguardar();
        });

        return false;




    }


    // função responsável por deletar os cards
    function deletar(idMusica) {

        var idUsuario = sessionStorage.ID_USUARIO;

        console.log("Criar função de apagar post escolhido - ID" + idUsuario);

        // Realizamos a requisição no edpoint criado para deletar os cards
        fetch(`/avisos/deletar/${idUsuario}/${idMusica}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(function (resposta) {

            if (resposta.ok) {

                listarCards();

            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });
    }




</script>
