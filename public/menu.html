<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="./css/menu.css">
</head>
<body>
    
     <header id="conteiner_cabecalho">

      <div id="imagem_cabecalho">
        <img src="./assets/imagens/Logo.svg" alt="">
      </div>
      <div id="Conteiner_informações">
        <h6><a href="./menu.html">Menu</a></h6>
         <h6><a href="./telahome.html">Quiz</a></h6>
         <h6 ><a href="../dashboard/dashboard.html">Dashboard</a></h6>
      </div>
      <div>
        <button id="botao_sair"><a href="./index.html">Sair</a></button>
      </div>
    </header>

    <section id="conteiner_menu">

        <div id="conteinerPrincipal">

            <div>
                <img src="./assets/imagens/icone_nota.avif" alt="">
            </div>
            
            <div id="titulo_menu">
                <h2>Diário de Memórias Musicais</h2>
                <p>Músicas que marcaram sua jornada emocional</p>
        </div>
                
        
        
        <div>
            <button onclick="criar()" id="botao_memoria">+ Nova memória</button>
        </div>
        
        <div id="conteiner_card">
                
                <div id="conteiner_informacoes_card">
                    <h4>Moth to a flame</h4> 
                    <h6>The wekend</h6>
                </div>
                <div id="descricao_card">
                    Assistindo Maxton Hall
                </div>
                
                <div id="conteiner_ano">
                    
                    <div id="conteiner_sentimento">
                        Nostalgia
                    </div>
                    <div id="ano">
                        2025
                    </div>
                </div>
        </div>
            
        </section >



    </div>

    <div id="criar_card">
        <div id="novo_card">
            <img src="../public/assets/imagens/card_nota.avif" alt="">
            <h4>Nova  Memória Musical</h4>
            <div id="sair_criar">
                <a href="./menu.html"><img src="./assets/imagens/icone-x.png" alt=""></a>            
            </div>
        </div>
        <div id="informacoes_card">
            
            <p>Nome da Música</p>
            
            <input type="text" placeholder=" Ex: The Hills">
            
            <p>Artista</p>
            
            <input type="text" placeholder=" Ex: The Wekend">
            
            <p>Memória</p>
            
            <input type="text" placeholder=" Descreva a memória especial">
            
            <p>Emoção</p>
            <select name="" id="sel_emocao">
                <option value="">Selecione</option>
                <option value="">Paz</option>
                <option value="">Amor</option>
                <option value="">Alegria</option>
                <option value="">Energia</option>
                <option value="">Esperança</option>
                <option value="">Nostalgia</option>
            </select>
            
            <p>Ano</p>
            <input type="Number" placeholder=" Ex: 2026">
            
        </div>

        <div id="botoes_card">

            <button onclick="cancelar()" id="botao_cancelar">Cancelar</button>
            <button id="botao_salvar">Salvar</button>
            
        </div>

    </div>



</body>
</html>
<script>

    function criar(){

        criar_card.style.display = "block"


    }

    function cancelar(){

        criar_card.style.display = "none"


    }


</script>
