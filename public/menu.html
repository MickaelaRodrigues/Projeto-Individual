                <option value="Alegria">Alegria</option>

                <option value="Nostalgia">Nostalgia</option>
            </select>

            <p>Ano</p>
            <input id="anoCard" type="Number" placeholder=" Ex: 2026">

        </div>

        <div id="botoes_card">

            <button onclick="cancelar()" id="botao_cancelar">Cancelar</button>
            <button id="botao_salvar" onclick="publicar()">Salvar</button>

        </div>

<script>

    function criar() {

        criar_card.style.display = "block"


    }

    function cancelar() {

        criar_card.style.display = "none"


    }

    function limparFormulario() {
        nomeMusica.value = "";
        cantor.value = "";
        descricao.value = "";
        sel_emocao.value = "Selecione";
        anoCard.value = "";
    }

    function publicar() {
        var idUsuario = sessionStorage.ID_USUARIO;

        var corpo = {
            nomeMusica: nomeMusica.value,
            cantor: cantor.value,
            descricao: descricao.value,
            tipoSentimento: sel_emocao.value,
            anoCard: anoCard.value
        }

        fetch(`/avisos/publicar/${idUsuario}`, {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({

                nomeMusica: corpo.nomeMusica,
                cantor: corpo.cantor,
                descricao: corpo.descricao,
                tipoSentimento: corpo.tipoSentimento,
                anoCard: corpo.anoCard

            })
        }).then(function (resposta) {

            console.log("resposta: ", resposta);

            if (resposta.ok) {
                window.alert("Post realizado com sucesso pelo usuario de ID: " + idUsuario + "!");
                limparFormulario();
                listarCards()
                // finalizarAguardar();
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            // finalizarAguardar();
        });

        return false;

    }

    function listarCards() {

        var idUsuario = sessionStorage.ID_USUARIO;


        fetch(`/avisos/listar/${idUsuario}`, {
            method: "get",
            headers: {
                "Content-Type": "application/json"
            }

        }).then(function (resposta) {

            console.log("resposta: ", resposta);

            if (resposta.ok) {

                resposta.json().then(function (respostaConvertida) {

                    let  listaCards = "";
 

                    for (let i = 0; i < resposta.length; i++) {

                        listaCards +=
                            `<div id="conteiner_card">
                            
                            <div id="conteiner_informacoes_card">
                                <h4>${respota[i].MÚSICA}</h4>
                                <h6>${resposta[i].ARTISTA}</h6>
                                </div>
                                <div id="descricao_card">
                                    ${resposta[i].DESCRIÇÃO}
                                    </div>
                                    
                                    <div id="conteiner_ano">
                                        
                                        <div id="conteiner_sentimento">
                                            ${resposta[i].SENTIMENTO}
                                            </div>
                                            <div id="ano">
                                                ${resposta[i].ANO}
                                                </div>
                                                </div>
                                                </div>`

                    }

                   

                        conteiner_card.innerHTML = listaCards

                    
                })

            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            // finalizarAguardar();
        });

        return false;




    }
