<script>

   function pegar_perguntas() {

    conteiner_quiz_perguntas.innerHTML = ``

    fetch("/quiz/listar", {
        method: "GET",
        headers: {
            "Content-Type": "application/json",
        },
    })
    .then(function (resposta) {
        
            return resposta.json(); 
    })
    .then(function (dados_json) {



        for(let i =0; i<dados_json.length;i++){
        
            let bloco_alternativas = ``;

        for(let j =0; j<dados_json[i].alternativas.length;j++){
        
            bloco_alternativas += `<button>${dados_json[i].alternativas[j]}</button>`
        }

            conteiner_quiz_perguntas.innerHTML += `
            <div class="pergunta">

                <div class="titulo">
                    <h2>${dados_json[i].pergunta}</h2>
                </div>

                <div class="opcoes_resposta">

                ${bloco_alternativas}

                </div>

            </div>
            
            `

            
        }
        
    })
    .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
    });
}
    

  





</script>
