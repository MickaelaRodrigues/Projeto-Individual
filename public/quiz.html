    // Criação de 2 vetores para armazenar as questões e características

    let bloco_questoes = [];

    let bloco_caracteristica = [];

    // Iniciando função para pegar os dados de Json de Objetos

    function pegar_perguntas() {


        conteiner_quiz_perguntas.innerHTML = ""

        // Criação de uma estruturta de Repetição para percorrer o vetor das perguntas 
        // Criação de outra estrutura de Repetição para  percorrer as alternativas e características

        for (let i = 0; i < jsonPerguntas.length; i++) {

            let bloco_alternativas = ``;

            for (let j = 0; j < jsonPerguntas[i].alternativas.length; j++) {

                bloco_alternativas += 
                `<button onclick="passar_alternativa('${jsonPerguntas[i].alternativas[j].id}')">
                    ${jsonPerguntas[i].alternativas[j].texto}
                    </button>`
            }

    //Armazenando os dados que já foram trabalhados dentro do vetor

            bloco_questoes.push(

                `
                        <div class="pergunta">
                            
                            <div class="titulo">
                                <h2>${jsonPerguntas[i].pergunta}</h2>
                            </div>
                                
                            <div class="opcoes_resposta">
                                    
                             ${bloco_alternativas}
                                    
                            </div>
                                    
                            </div>
                                    
                            `
            )
        }

   //Tempo para mostrar cada pergunta

        setTimeout(mostrar_pergunta, 500)

    }

    function mostrar_pergunta() {

        conteiner_quiz_perguntas.innerHTML = bloco_questoes[pergunta_atual - 1]


    }

    // Estrutura para passar as alternativas quando clicamos na resposta que queremos

    function passar_alternativa(alternativa) {

        pergunta_atual += 1;

    // Fetch que é utilizado através da rota criada quiz/salvar

        fetch("/quiz/salvar", {
            // Método para inserir as alternativas escolhidas utilizando o Id do usuário
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                
                fk_alternativaServer: alternativa,
                fk_usuarioServer: sessionStorage.ID_USUARIO


            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {

                    //Se o Json jpá tiver sido percorrido, direcionara para dashboard
                    if (pergunta_atual > jsonPerguntas.length) {
                        
                        setTimeout(() => {
                            window.location = "dashboard/dashboard.html";
                        }, "2000");
                        
                        
                    } else {
                     // Enquanto o Json não for percorrido completamente, será mostrado as perguntas
                        
                        mostrar_pergunta()

                    }


                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";

                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);

            });




    }


</script>
