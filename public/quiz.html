<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ</title>
    <link rel="stylesheet" href="./css/quiz.css">
    <script src="./js/sessao.js"></script>
</head>

<body onload="pegar_perguntas(),validarSessao()">

    <header id="conteiner_cabecalho">

        <div id="imagem_cabecalho">
            <img src="./assets/imagens/Logo.svg" alt="">
        </div>
        <div id="Conteiner_informações">
            <h6><a href="./telahome.html">Quiz</a></h6>
         <h6><a href="/public/dashboard/dashboard.html">Dashboarda</a></h6>
        </div>
        <div id="botao_saida">
            <h6><a href="./index.html">Sair</a></h6>
        </div>
    </header>

    <section id="sessao_quiz">

        <h1>Quiz</h1>
        <div id="conteiner_quiz_perguntas">

        </div>


    </section>
</body>

</html>
<script>

    let mpb = 0
    let pop = 0
    let funk = 0
    let trap = 0
    let samba = 0
    let gospel = 0
    let raggae = 0
    let sertanejo = 0
    let rap = 0

    let pergunta_atual = 1

    let bloco_questoes = [];

    let bloco_caracteristica = [];




    function pegar_perguntas() {

        conteiner_quiz_perguntas.innerHTML = ""

        fetch("/quiz/listar", {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            },
        })
            .then(function (resposta) {

                return resposta.json();
            })
            .then(function (dados_json) {

                console.log("Dados recebidos:", dados_json);

                for (let i = 0; i < dados_json.length; i++) {

                    let bloco_alternativas = ``;

                    for (let j = 0; j < dados_json[i].alternativas.length; j++) {

                        bloco_alternativas += `<button onclick="passar_caracteristica('${dados_json[i].caracteristicas[j]}')">${dados_json[i].alternativas[j]}</button>`
                    }
                    bloco_questoes.push(

                        `
                        <div class="pergunta">
                            
                            <div class="titulo">
                                <h2>${dados_json[i].pergunta}</h2>
                            </div>
                                
                            <div class="opcoes_resposta">
                                    
                             ${bloco_alternativas}
                                    
                            </div>
                                    
                            </div>
                                    
                                    `
                    )


                }
                setTimeout(mostrar_pergunta, 500)
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
            });
    }

    function mostrar_pergunta() {

        conteiner_quiz_perguntas.innerHTML = bloco_questoes[pergunta_atual - 1]


    }

    function passar_caracteristica(caracteristica) {

        bloco_caracteristica.push(caracteristica)

        pergunta_atual += 1;


        if (pergunta_atual > bloco_questoes.length) {

            for (let i = 0; i < bloco_caracteristica.length; i++) {


                if (bloco_caracteristica[i] == `MPB`) { mpb += 1 }
                else if (bloco_caracteristica[i] == `Pop`) { pop += 1 }
                else if (bloco_caracteristica[i] == `Funk`) { funk += 1 }
                else if (bloco_caracteristica[i] == `Trap`) { trap += 1 }
                else if (bloco_caracteristica[i] == `Samba`) { samba += 1 }
                else if (bloco_caracteristica[i] == `Gospel`) { gospel += 1 }
                else if (bloco_caracteristica[i] == `Raggae`) { raggae += 1 }
                else if (bloco_caracteristica[i] == `Sertanejo`) { sertanejo += 1 }

            }
            alert (`${mpb},${pop},${funk},${trap},${samba},${gospel},${raggae},${sertanejo}`)
            
            alert(`Fim do quiz`)

        } else {

            mostrar_pergunta()
        }




    }






</script>
